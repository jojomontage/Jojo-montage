<style>
/* Layout concept: a slim reel-label bar on top, each tool fills the rest of the window. */
:root {
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #e5e9ef;
  --ink: #141922;
  --muted: #566275;
  --line: #cfd6e0;
  --accent: #2447d6;
  --on-accent: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141a; --surface: #171d25; --surface-2: #212934; --ink: #e7ebf1; --muted: #98a3b4; --line: #2b3441;
    --accent: #86a1ff; --on-accent: #0a1020;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141a; --surface: #171d25; --surface-2: #212934; --ink: #e7ebf1; --muted: #98a3b4; --line: #2b3441;
  --accent: #86a1ff; --on-accent: #0a1020;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  display: grid;
  grid-template-rows: auto 1fr;
  overflow: hidden;
}
.bar {
  display: flex; align-items: flex-end; gap: 4px 18px; flex-wrap: wrap;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
}
.brand { font: 700 1.35rem/1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase; padding: 0 0 12px; white-space: nowrap; }
.brand small { display: block; font: 500 10.5px/1 var(--font-mono); letter-spacing: 0.08em; color: var(--muted); margin-top: 5px; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; min-width: 0; }
.tab {
  font: 600 13.5px/1 var(--font-body); letter-spacing: 0.03em;
  color: var(--muted); background: transparent;
  border: 0; border-bottom: 3px solid transparent;
  padding: 12px 16px 11px; cursor: pointer;
}
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.panes { position: relative; min-height: 0; }
iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
iframe[hidden] { display: none; }
@media (max-width: 520px) { .brand small { display: none; } }
</style>
</head>

<script>
// Chaque outil est une page HTML complète, intégrée telle quelle.

const TOOLS = [
  { id: "marker-diff", label: "Marker Diff", html: "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<title>Marker Diff by Joël Li<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<style>\n/* Layout concept: a turnover change-list sheet. Two input \"reels\" side by side (old / new),\n   a slate-style summary bar of statuses, then a ruled timecode table. */\n:root {\n  --font-display: \"Barlow Condensed\", \"Arial Narrow\", \"Helvetica Neue\", sans-serif;\n  --font-body: \"Barlow\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-mono: \"IBM Plex Mono\", ui-monospace, Menlo, Consolas, monospace;\n\n  --bg: #eef1f5;\n  --surface: #ffffff;\n  --surface-2: #e5e9ef;\n  --ink: #141922;\n  --muted: #566275;\n  --line: #cfd6e0;\n  --accent: #2447d6;\n  --on-accent: #ffffff;\n\n  --removed: #b3261e;  --removed-bg: #fbe7e5;\n  --added: #17743a;    --added-bg: #e2f4e8;\n  --moved: #9a5400;    --moved-bg: #fdefd8;\n  --modified: #6637c2; --modified-bg: #eee7fb;\n  --same: #566275;     --same-bg: #e5e9ef;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg: #10141a; --surface: #171d25; --surface-2: #212934; --ink: #e7ebf1; --muted: #98a3b4; --line: #2b3441;\n    --accent: #86a1ff; --on-accent: #0a1020;\n    --removed: #ff8f86;  --removed-bg: #3a1d20;\n    --added: #72d68f;    --added-bg: #15301f;\n    --moved: #f4b862;    --moved-bg: #372911;\n    --modified: #bba2ff; --modified-bg: #2a2148;\n    --same: #98a3b4;     --same-bg: #212934;\n    color-scheme: dark;\n  }\n}\n:root[data-theme=\"dark\"] {\n  --bg: #10141a; --surface: #171d25; --surface-2: #212934; --ink: #e7ebf1; --muted: #98a3b4; --line: #2b3441;\n  --accent: #86a1ff; --on-accent: #0a1020;\n  --removed: #ff8f86;  --removed-bg: #3a1d20;\n  --added: #72d68f;    --added-bg: #15301f;\n  --moved: #f4b862;    --moved-bg: #372911;\n  --modified: #bba2ff; --modified-bg: #2a2148;\n  --same: #98a3b4;     --same-bg: #212934;\n  color-scheme: dark;\n}\n\n* { box-sizing: border-box; }\nbody {\n  background: var(--bg);\n  color: var(--ink);\n  font: 400 15px/1.5 var(--font-body);\n  padding-block: 28px 56px;\n  padding-left: max(16px, env(safe-area-inset-left, 0px));\n  padding-right: max(16px, env(safe-area-inset-right, 0px));\n}\n.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 22px; }\nh1, h2 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; }\nh1 { font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 0.95; letter-spacing: 0.01em; text-transform: uppercase; }\nh2 { font-size: 1.25rem; letter-spacing: 0.06em; text-transform: uppercase; }\n.kicker { font: 500 12px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }\n.byline { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 14px 0 0; font: 500 13px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }\na.linkbtn { font: 600 12.5px/1 var(--font-body); letter-spacing: 0.03em; text-transform: none; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 8px 11px; display: inline-flex; align-items: center; gap: 6px; }\na.linkbtn:hover { background: var(--surface-2); }\na.linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n.lede { max-width: 62ch; color: var(--muted); margin: 12px 0 0; }\n\n.inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 16px; }\n.reel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; display: grid; gap: 10px; padding: 14px; min-width: 0; }\n.reel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }\n.reel-head h2 { display: flex; align-items: center; gap: 10px; }\n.tag { font: 500 11px/1 var(--font-mono); letter-spacing: 0.06em; padding: 4px 6px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }\ntextarea { width: 100%; min-height: 190px; resize: vertical; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 10px; font: 400 12.5px/1.5 var(--font-mono); white-space: pre; overflow: auto; }\ntextarea:focus-visible, input:focus-visible, select:focus-visible, button:focus-visible, .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }\n.info { margin: 0; font: 400 12.5px/1.4 var(--font-mono); color: var(--muted); min-height: 1.4em; }\n.info.warn { color: var(--removed); }\n\nbutton, .filebtn { font: 600 13px/1 var(--font-body); letter-spacing: 0.03em; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }\nbutton:hover, .filebtn:hover { background: var(--surface-2); }\n.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }\n.filebtn { position: relative; }\nbutton.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }\nbutton.primary:hover { filter: brightness(1.08); background: var(--accent); }\n.actions { display: flex; gap: 8px; flex-wrap: wrap; }\n\n.options { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }\n.field { display: grid; gap: 5px; min-width: 0; }\n.field label { font: 500 11px/1 var(--font-mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }\nselect, input[type=\"text\"] { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font: 400 13px/1.2 var(--font-mono); min-width: 0; }\ninput[type=\"text\"] { width: min(100%, 250px); }\ninput:disabled { opacity: 0.5; }\n.options .spacer { flex: 1 1 0; }\n\n.summary { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }\n.chip { flex: 1 1 130px; display: grid; gap: 4px; text-align: left; padding: 10px 12px; border-radius: 5px; border: 1px solid transparent; background: var(--chip-bg); color: var(--chip-fg); opacity: 0.55; }\n.chip:hover { background: var(--chip-bg); filter: brightness(0.97); }\n.chip[aria-pressed=\"true\"] { opacity: 1; border-color: var(--chip-fg); }\n.chip .n { font: 700 2rem/1 var(--font-display); font-variant-numeric: tabular-nums; }\n.chip .l { font: 500 11px/1.1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; }\n.chip[data-s=\"removed\"], .pill[data-s=\"removed\"] { --chip-bg: var(--removed-bg); --chip-fg: var(--removed); }\n.chip[data-s=\"added\"], .pill[data-s=\"added\"] { --chip-bg: var(--added-bg); --chip-fg: var(--added); }\n.chip[data-s=\"moved\"], .pill[data-s=\"moved\"] { --chip-bg: var(--moved-bg); --chip-fg: var(--moved); }\n.chip[data-s=\"modified\"], .pill[data-s=\"modified\"] { --chip-bg: var(--modified-bg); --chip-fg: var(--modified); }\n.chip[data-s=\"same\"], .pill[data-s=\"same\"] { --chip-bg: var(--same-bg); --chip-fg: var(--same); }\n\n.tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; }\ntable { border-collapse: collapse; width: 100%; min-width: 720px; }\nth { text-align: left; font: 500 11px/1 var(--font-mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 11px 12px; border-bottom: 2px solid var(--ink); white-space: nowrap; }\ntd { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }\ntr:last-child td { border-bottom: 0; }\ntd.tc, td.delta { font: 400 13px/1.4 var(--font-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }\ntd.id { font: 500 13px/1.4 var(--font-mono); white-space: nowrap; }\n.pill { display: inline-block; font: 500 11px/1 var(--font-mono); letter-spacing: 0.05em; text-transform: uppercase; padding: 5px 7px; border-radius: 3px; background: var(--chip-bg); color: var(--chip-fg); white-space: nowrap; }\n.dim { color: var(--muted); }\ndel { color: var(--muted); text-decoration-thickness: 1px; }\nins { text-decoration: none; background: var(--modified-bg); color: var(--ink); padding: 0 2px; border-radius: 2px; }\n.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line); margin-right: 6px; vertical-align: -1px; }\n.empty { padding: 28px 16px; color: var(--muted); text-align: center; }\n\n.export { display: grid; gap: 10px; }\n.export p { margin: 0; color: var(--muted); max-width: 70ch; }\n#outWrap { display: grid; gap: 6px; }\n#outText { min-height: 130px; }\n.foot { color: var(--muted); font-size: 13px; max-width: 75ch; }\n@media (prefers-reduced-motion: no-preference) { button, .chip { transition: background 0.12s, opacity 0.12s; } }\n<\/style>\n\n<main class=\"wrap\">\n  <header>\n    <p class=\"kicker\">Assistant monteur · Avid Media Composer<\/p>\n    <h1>Marker Diff<\/h1>\n    <p class=\"byline\"><span>by Joël Li<\/span><a class=\"linkbtn\" href=\"https://www.imdb.com/fr/name/nm9282378\" target=\"_blank\" rel=\"noopener noreferrer\">Profil IMDb ↗<\/a><\/p>\n    <p class=\"lede\">Colle ou charge l'export de markers de l'ancienne et de la nouvelle séquence. L'outil indique quels markers ont disparu, sont apparus, ont bougé ou ont changé de commentaire, de couleur ou de piste.<\/p>\n  <\/header>\n\n  <section class=\"inputs\" aria-label=\"Exports de markers\">\n    <div class=\"reel\">\n      <div class=\"reel-head\">\n        <h2><span class=\"tag\">OLD<\/span> Ancienne séquence<\/h2>\n        <div class=\"actions\">\n          <label class=\"filebtn\">Charger un .txt<input type=\"file\" id=\"oldFile\" accept=\".txt,.tsv,text/plain\"><\/label>\n        <\/div>\n      <\/div>\n      <textarea id=\"oldText\" spellcheck=\"false\" aria-label=\"Markers de l'ancienne séquence\" placeholder=\"Colle ici l'export de markers (Fenêtre Markers > Export > .txt)\"><\/textarea>\n      <p class=\"info\" id=\"oldInfo\"><\/p>\n    <\/div>\n    <div class=\"reel\">\n      <div class=\"reel-head\">\n        <h2><span class=\"tag\">NEW<\/span> Nouvelle séquence<\/h2>\n        <div class=\"actions\">\n          <label class=\"filebtn\">Charger un .txt<input type=\"file\" id=\"newFile\" accept=\".txt,.tsv,text/plain\"><\/label>\n        <\/div>\n      <\/div>\n      <textarea id=\"newText\" spellcheck=\"false\" aria-label=\"Markers de la nouvelle séquence\" placeholder=\"Colle ici l'export de markers (Fenêtre Markers > Export > .txt)\"><\/textarea>\n      <p class=\"info\" id=\"newInfo\"><\/p>\n    <\/div>\n  <\/section>\n\n  <section class=\"options\" aria-label=\"Réglages\">\n    <div class=\"field\">\n      <label for=\"keyMode\">Associer les markers par<\/label>\n      <select id=\"keyMode\">\n        <option value=\"id\">ID dans le commentaire<\/option>\n        <option value=\"comment\">Commentaire entier<\/option>\n      <\/select>\n    <\/div>\n    <div class=\"field\">\n      <label for=\"idRegex\">Motif de l'ID (regex)<\/label>\n      <input type=\"text\" id=\"idRegex\" value=\"[A-Za-z]{2,6}[_-]?\\d{2,5}\" spellcheck=\"false\" autocomplete=\"off\">\n    <\/div>\n    <div class=\"field\">\n      <label for=\"fps\">Cadence<\/label>\n      <select id=\"fps\">\n        <option value=\"23.976\">23.976<\/option>\n        <option value=\"24\" selected>24<\/option>\n        <option value=\"25\">25<\/option>\n        <option value=\"29.97\">29.97<\/option>\n        <option value=\"30\">30<\/option>\n      <\/select>\n    <\/div>\n    <div class=\"spacer\"><\/div>\n    <div class=\"actions\">\n      <button type=\"button\" id=\"runBtn\" class=\"primary\">Comparer<\/button>\n      <button type=\"button\" id=\"clearBtn\">Vider<\/button>\n    <\/div>\n  <\/section>\n\n  <section aria-label=\"Résumé\"><div class=\"summary\" id=\"summary\"><\/div><\/section>\n\n  <section aria-label=\"Résultats\">\n    <div class=\"tablewrap\" id=\"results\"><\/div>\n  <\/section>\n\n  <section class=\"export\" aria-label=\"Export\">\n    <h2>Exporter<\/h2>\n    <p>Le fichier .txt contient les lignes affichées, prêtes à importer dans la nouvelle séquence (Markers > Import) : rouge supprimé, vert nouveau, jaune déplacé, magenta modifié. Les statuts désactivés plus haut n'y figurent pas.<\/p>\n    <div class=\"actions\">\n      <button type=\"button\" id=\"downloadAvid\" class=\"primary\">Télécharger les markers Avid (.txt)<\/button>\n      <button type=\"button\" id=\"copyReport\">Copier le rapport (TSV)<\/button>\n    <\/div>\n    <p class=\"info\" id=\"dlMsg\" role=\"status\"><\/p>\n    <div id=\"outWrap\" hidden>\n      <p class=\"info\" id=\"outMsg\"><\/p>\n      <textarea id=\"outText\" readonly spellcheck=\"false\" aria-label=\"Texte à copier\"><\/textarea>\n    <\/div>\n  <\/section>\n\n  <p class=\"foot\">Les timecodes sont comparés en images à partir de la cadence choisie (calcul sans correction drop frame). Un marker supprimé est placé à sa position dans l'ancienne séquence. Rien n'est envoyé : la comparaison se fait dans ton navigateur.<\/p>\n<\/main>\n\n<\script>\n//#core-start\nconst COLORS = ['red', 'green', 'blue', 'cyan', 'magenta', 'yellow', 'black', 'white'];\nconst TC_RE = /^\\d{2}[:;]\\d{2}[:;]\\d{2}[:;]\\d{2}$/;\nconst TC_FIND = /\\d{2}[:;]\\d{2}[:;]\\d{2}[:;]\\d{2}/;\n\nfunction tcToFrames(tc, fps) {\n  const p = tc.split(/[:;]/).map(Number);\n  const nf = Math.round(fps) || 25;\n  return ((p[0] * 60 + p[1]) * 60 + p[2]) * nf + p[3];\n}\n\nfunction parseLine(raw) {\n  const f = raw.split('\\t').map(s => s.trim());\n  const i = f.findIndex(x => TC_RE.test(x));\n  let user, tc, track = '', color = '', rest;\n  if (i >= 0 && f.length > i + 1) {\n    user = f.slice(0, i).join(' ');\n    tc = f[i];\n    track = f[i + 1] || '';\n    let j = i + 2;\n    if (f[j] && COLORS.includes(f[j].toLowerCase())) { color = f[j].toLowerCase(); j++; }\n    rest = f.slice(j);\n  } else {\n    const mm = raw.match(TC_FIND);\n    if (!mm) return null;\n    user = raw.slice(0, mm.index).trim();\n    tc = mm[0];\n    const after = raw.slice(mm.index + tc.length).trim().split(/\\s+/).filter(Boolean);\n    track = after.shift() || '';\n    if (after[0] && COLORS.includes(after[0].toLowerCase())) color = after.shift().toLowerCase();\n    rest = [after.join(' ')];\n  }\n  let duration = '';\n  if (rest.length > 1 && /^\\d+$/.test(rest[rest.length - 1])) duration = rest.pop();\n  const comment = rest.join(' ').replace(/\\s+/g, ' ').trim();\n  return { user, tc, track, color, comment, duration };\n}\n\nfunction parseMarkers(text) {\n  const markers = [];\n  let skipped = 0;\n  for (const raw of String(text || '').split(/\\r\\n|\\n|\\r/)) {\n    if (!raw.trim()) continue;\n    const m = parseLine(raw);\n    if (m) markers.push(m); else skipped++;\n  }\n  return { markers, skipped };\n}\n\nconst normText = s => String(s || '').toLowerCase().replace(/\\s+/g, ' ').trim();\n\nfunction makeKey(m, opts) {\n  if (opts.mode === 'id' && opts.re) {\n    const mm = m.comment.match(opts.re);\n    if (mm) return { key: 'id:' + mm[0].toUpperCase().replace(/[^A-Z0-9]/g, ''), label: mm[0], hasId: true };\n  }\n  return { key: 'txt:' + normText(m.comment), label: '', hasId: false };\n}\n\nfunction compareMarkers(oldList, newList, opts) {\n  const fps = Math.round(opts.fps) || 25;\n  const prep = list => list.map(m => Object.assign({}, m, makeKey(m, opts), { frames: tcToFrames(m.tc, fps) }));\n  const O = prep(oldList), N = prep(newList);\n  const groups = new Map();\n  const put = (arr, side) => arr.forEach(m => {\n    if (!groups.has(m.key)) groups.set(m.key, { o: [], n: [] });\n    groups.get(m.key)[side].push(m);\n  });\n  put(O, 'o'); put(N, 'n');\n\n  const rows = [];\n  for (const g of groups.values()) {\n    const combos = [];\n    g.o.forEach((o, oi) => g.n.forEach((n, ni) => combos.push({ oi, ni, d: Math.abs(o.frames - n.frames) })));\n    combos.sort((a, b) => a.d - b.d || a.oi - b.oi || a.ni - b.ni);\n    const usedO = new Set(), usedN = new Set(), pairs = [];\n    for (const c of combos) {\n      if (usedO.has(c.oi) || usedN.has(c.ni)) continue;\n      usedO.add(c.oi); usedN.add(c.ni);\n      pairs.push([g.o[c.oi], g.n[c.ni]]);\n    }\n    g.o.forEach((o, oi) => { if (!usedO.has(oi)) rows.push({ status: 'removed', id: o.label, old: o, new: null, delta: 0, changes: [] }); });\n    g.n.forEach((n, ni) => { if (!usedN.has(ni)) rows.push({ status: 'added', id: n.label, old: null, new: n, delta: 0, changes: [] }); });\n    for (const [o, n] of pairs) {\n      const delta = n.frames - o.frames;\n      const changes = [];\n      if (normText(o.comment) !== normText(n.comment)) changes.push('comment');\n      if (o.color !== n.color) changes.push('couleur');\n      if (o.track !== n.track) changes.push('piste');\n      const status = delta !== 0 ? 'moved' : (changes.length ? 'modified' : 'same');\n      rows.push({ status, id: n.label || o.label, old: o, new: n, delta, changes });\n    }\n  }\n  const ref = r => (r.new ? r.new.frames : r.old.frames);\n  rows.sort((a, b) => ref(a) - ref(b) || a.status.localeCompare(b.status));\n  const counts = { removed: 0, added: 0, moved: 0, modified: 0, same: 0 };\n  rows.forEach(r => counts[r.status]++);\n  return { rows, counts };\n}\n\nfunction fmtDelta(d, fps) {\n  if (!d) return '0';\n  const nf = Math.round(fps) || 25;\n  const sign = d > 0 ? '+' : '-';\n  const a = Math.abs(d);\n  const s = Math.floor(a / nf), f = a % nf;\n  return sign + a + ' f' + (s ? ' (' + sign + s + 's ' + f + 'f)' : '');\n}\n\nconst STATUS_LABEL = { removed: 'Supprimé', added: 'Nouveau', moved: 'Déplacé', modified: 'Modifié', same: 'Inchangé' };\nconst clean = s => String(s || '').replace(/[\\t\\r\\n]+/g, ' ').trim();\n\nfunction reportTSV(rows, fps) {\n  const head = ['Statut', 'ID', 'TC ancien', 'TC nouveau', 'Delta', 'Couleur ancien', 'Couleur nouveau', 'Commentaire ancien', 'Commentaire nouveau'];\n  const lines = [head.join('\\t')];\n  rows.forEach(r => lines.push([\n    STATUS_LABEL[r.status], r.id, r.old ? r.old.tc : '', r.new ? r.new.tc : '',\n    r.old && r.new ? fmtDelta(r.delta, fps) : '',\n    r.old ? r.old.color : '', r.new ? r.new.color : '',\n    clean(r.old ? r.old.comment : ''), clean(r.new ? r.new.comment : '')\n  ].map(clean).join('\\t')));\n  return lines.join('\\n');\n}\n\nfunction avidMarkers(rows, fps) {\n  const out = [];\n  rows.forEach(r => {\n    if (r.status === 'same') return;\n    let m, color, text;\n    if (r.status === 'removed') { m = r.old; color = 'red'; text = 'SUPPRIMÉ ' + m.comment; }\n    else if (r.status === 'added') { m = r.new; color = 'green'; text = 'NOUVEAU ' + m.comment; }\n    else if (r.status === 'moved') { m = r.new; color = 'yellow'; text = 'DÉPLACÉ ' + fmtDelta(r.delta, fps) + ' ' + m.comment; }\n    else { m = r.new; color = 'magenta'; text = 'MODIFIÉ (' + r.changes.join(', ') + ') ' + m.comment; }\n    out.push(['DIFF', m.tc, m.track || 'V1', color, clean(text), '1'].join('\\t'));\n  });\n  return out.join('\\n');\n}\n//#core-end\n\n/* ---------- UI ---------- */\nconst $ = id => document.getElementById(id);\nconst filter = { removed: true, added: true, moved: true, modified: true, same: false };\nlet last = { rows: [], counts: null, fps: 25 };\n\nconst COLOR_HEX = { red: '#e53935', green: '#2e9e4f', blue: '#2f6fe0', cyan: '#12b5c9', magenta: '#c2379d', yellow: '#e8b923', black: '#111', white: '#fff' };\nconst esc = s => String(s == null ? '' : s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst dot = c => c ? '<span class=\"dot\" style=\"background:' + (COLOR_HEX[c] || 'transparent') + '\"><\/span>' + esc(c) : '<span class=\"dim\">-<\/span>';\n\nfunction setInfo(el, res, text) {\n  if (!text.trim()) { el.textContent = ''; el.className = 'info'; return; }\n  if (!res.markers.length) {\n    el.textContent = 'Aucun marker reconnu. Chaque ligne doit contenir un timecode (HH:MM:SS:FF).';\n    el.className = 'info warn';\n    return;\n  }\n  el.textContent = res.markers.length + ' marker' + (res.markers.length > 1 ? 's' : '') + ' lu' + (res.markers.length > 1 ? 's' : '') +\n    (res.skipped ? ' · ' + res.skipped + ' ligne' + (res.skipped > 1 ? 's' : '') + ' ignorée' + (res.skipped > 1 ? 's' : '') : '');\n  el.className = 'info';\n}\n\nfunction renderSummary() {\n  const c = last.counts || { removed: 0, added: 0, moved: 0, modified: 0, same: 0 };\n  const labels = { removed: 'Supprimés', added: 'Nouveaux', moved: 'Déplacés', modified: 'Modifiés', same: 'Inchangés' };\n  $('summary').innerHTML = ['removed', 'added', 'moved', 'modified', 'same'].map(s =>\n    '<button type=\"button\" class=\"chip\" data-s=\"' + s + '\" aria-pressed=\"' + filter[s] + '\"><span class=\"n\">' + c[s] + '<\/span><span class=\"l\">' + labels[s] + '<\/span><\/button>'\n  ).join('');\n}\n\nfunction visibleRows() { return last.rows.filter(r => filter[r.status]); }\n\nfunction renderTable(hasInput) {\n  const box = $('results');\n  if (!hasInput) {\n    box.innerHTML = '<div class=\"empty\">Colle ou charge deux exports de markers pour voir les différences ici.<\/div>';\n    return;\n  }\n  const rows = visibleRows();\n  if (!rows.length) {\n    box.innerHTML = '<div class=\"empty\">' + (last.rows.length ? 'Aucune ligne pour les statuts sélectionnés. Active un filtre ci-dessus.' : 'Aucun marker à comparer.') + '<\/div>';\n    return;\n  }\n  const fps = last.fps;\n  const body = rows.map(r => {\n    const o = r.old, n = r.new;\n    let comment;\n    if (r.status === 'modified' && r.changes.includes('comment')) comment = '<del>' + esc(o.comment) + '<\/del><br><ins>' + esc(n.comment) + '<\/ins>';\n    else comment = esc((n || o).comment) || '<span class=\"dim\">-<\/span>';\n    let color;\n    if (o && n && o.color !== n.color) color = dot(o.color) + ' <span class=\"dim\">→<\/span> ' + dot(n.color);\n    else color = dot((n || o).color);\n    const extra = (r.status === 'moved' && r.changes.length) ? '<br><span class=\"dim\">aussi : ' + esc(r.changes.join(', ')) + '<\/span>' : '';\n    return '<tr><td><span class=\"pill\" data-s=\"' + r.status + '\">' + STATUS_LABEL[r.status] + '<\/span><\/td>' +\n      '<td class=\"id\">' + (esc(r.id) || '<span class=\"dim\">sans ID<\/span>') + '<\/td>' +\n      '<td class=\"tc\">' + (o ? esc(o.tc) : '<span class=\"dim\">-<\/span>') + '<\/td>' +\n      '<td class=\"tc\">' + (n ? esc(n.tc) : '<span class=\"dim\">-<\/span>') + '<\/td>' +\n      '<td class=\"delta\">' + (o && n ? esc(fmtDelta(r.delta, fps)) : '<span class=\"dim\">-<\/span>') + '<\/td>' +\n      '<td>' + color + '<\/td>' +\n      '<td>' + comment + extra + '<\/td><\/tr>';\n  }).join('');\n  box.innerHTML = '<table><thead><tr><th>Statut<\/th><th>ID<\/th><th>TC ancien<\/th><th>TC nouveau<\/th><th>Écart<\/th><th>Couleur<\/th><th>Commentaire<\/th><\/tr><\/thead><tbody>' + body + '<\/tbody><\/table>';\n}\n\nfunction run() {\n  const fps = parseFloat($('fps').value) || 25;\n  let mode = $('keyMode').value;\n  $('idRegex').disabled = mode !== 'id';\n  let re = null, regexMsg = '';\n  const src = $('idRegex').value.trim();\n  if (mode === 'id' && src) {\n    try { re = new RegExp(src, 'i'); } catch (e) { regexMsg = 'Motif invalide, comparaison par commentaire entier.'; }\n  }\n  if (mode === 'id' && !re) mode = 'comment';\n  const oText = $('oldText').value, nText = $('newText').value;\n  const o = parseMarkers(oText), n = parseMarkers(nText);\n  setInfo($('oldInfo'), o, oText);\n  setInfo($('newInfo'), n, nText);\n  if (regexMsg) { $('newInfo').textContent = regexMsg + ' ' + $('newInfo').textContent; $('newInfo').className = 'info warn'; }\n  const hasInput = !!(o.markers.length || n.markers.length);\n  const res = hasInput ? compareMarkers(o.markers, n.markers, { mode, re, fps }) : { rows: [], counts: null };\n  last = { rows: res.rows, counts: res.counts, fps };\n  renderSummary();\n  renderTable(hasInput);\n}\n\nlet timer = null;\nconst later = () => { clearTimeout(timer); timer = setTimeout(run, 150); };\n\nfunction readFile(file, target) {\n  const rd = new FileReader();\n  rd.onload = () => {\n    let txt = String(rd.result || '');\n    if (txt.indexOf(String.fromCharCode(65533)) >= 0) {\n      const rd2 = new FileReader();\n      rd2.onload = () => { target.value = String(rd2.result || ''); run(); };\n      rd2.readAsText(file, 'windows-1252');\n      return;\n    }\n    target.value = txt; run();\n  };\n  rd.readAsText(file, 'utf-8');\n}\nfunction wireFile(inputId, textId) {\n  const input = $(inputId), ta = $(textId);\n  input.addEventListener('change', () => { if (input.files && input.files[0]) readFile(input.files[0], ta); input.value = ''; });\n  ta.addEventListener('dragover', e => e.preventDefault());\n  ta.addEventListener('drop', e => {\n    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];\n    if (f) { e.preventDefault(); readFile(f, ta); }\n  });\n  ta.addEventListener('input', later);\n}\nwireFile('oldFile', 'oldText');\nwireFile('newFile', 'newText');\n['keyMode', 'idRegex', 'fps'].forEach(id => { $(id).addEventListener('input', later); $(id).addEventListener('change', later); });\n\n$('runBtn').addEventListener('click', () => { run(); $('results').scrollIntoView({ behavior: 'smooth', block: 'start' }); });\n$('clearBtn').addEventListener('click', () => { $('oldText').value = ''; $('newText').value = ''; $('outWrap').hidden = true; run(); });\n$('summary').addEventListener('click', e => {\n  const b = e.target.closest('.chip');\n  if (!b) return;\n  filter[b.dataset.s] = !filter[b.dataset.s];\n  renderSummary(); renderTable(!!last.counts);\n});\n\nasync function copyOut(text, label, hint) {\n  const ta = $('outText');\n  $('outWrap').hidden = false;\n  ta.value = text;\n  ta.focus(); ta.select();\n  let ok = false;\n  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }\n  $('outMsg').textContent = ok ? label + ' copié. ' + hint : 'Sélectionne le texte ci-dessous et copie-le (Ctrl ou Cmd + C). ' + hint;\n}\n$('copyReport').addEventListener('click', () => {\n  if (!last.rows.length) { copyOut('', 'Rapport', 'Aucune donnée à exporter.'); return; }\n  copyOut(reportTSV(visibleRows(), last.fps), 'Rapport', 'Colle-le dans Excel ou Google Sheets.');\n});\n\n// Téléchargement du .txt de markers Avid (UTF-8, fins de ligne Unix).\n// Dans claude.ai, le fichier passe par la capacité \"downloads\" ; ailleurs (GitHub Pages), par un lien de téléchargement classique.\nasync function saveTxt(filename, text) {\n  let dl = null;\n  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { dl = null; }\n  if (dl) { await dl.save({ filename, data: text }); return; }\n  const url = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));\n  const a = document.createElement('a');\n  a.href = url; a.download = filename;\n  document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 2000);\n}\n$('downloadAvid').addEventListener('click', async () => {\n  const msg = $('dlMsg');\n  const t = avidMarkers(visibleRows(), last.fps);\n  if (!t) { msg.textContent = 'Aucun changement à exporter. Compare d\\'abord deux séquences et garde au moins un statut actif.'; msg.className = 'info warn'; return; }\n  const n = t.split('\\n').length;\n  try {\n    await saveTxt('markers_changements.txt', t + '\\n');\n    msg.textContent = n + ' marker' + (n > 1 ? 's' : '') + ' exporté' + (n > 1 ? 's' : '') + ' dans markers_changements.txt. Dans Avid : Markers > Import dans la nouvelle séquence.';\n    msg.className = 'info';\n  } catch (e) {\n    if (e && e.code === 'declined') { msg.textContent = 'Téléchargement annulé.'; msg.className = 'info'; return; }\n    msg.textContent = 'Le téléchargement a échoué. Le texte est affiché ci-dessous : enregistre-le dans un .txt.'; msg.className = 'info warn';\n    copyOut(t, 'Markers de changement', 'Enregistre-les dans un .txt (fins de ligne Unix).');\n  }\n});\n\nrun();\n<\/script>\n\n<\/body><\/html>" },
  { id: "subcap", label: "EDL → SubCap", html: "<!doctype html><html><head><meta charset=utf8><meta name=viewport content=\"width=device-width,initial-scale=1,viewport-fit=cover\"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}<\/style><\/head><body>\n<title>EDL to SubCap<\/title>\n<meta name=\"claude:viewport-fit-sides\" content=\"cover\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<style>\n/* Layout concept: a conversion bench. EDL goes in on the left, options sit in a strip,\n   the caption list and the finished SubCap text come out below. */\n:root {\n  --font-display: \"Barlow Condensed\", \"Arial Narrow\", \"Helvetica Neue\", sans-serif;\n  --font-body: \"Barlow\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-mono: \"IBM Plex Mono\", ui-monospace, Menlo, Consolas, monospace;\n\n  --bg: #eef1f5;\n  --surface: #ffffff;\n  --surface-2: #e5e9ef;\n  --ink: #141922;\n  --muted: #566275;\n  --line: #cfd6e0;\n  --accent: #2447d6;\n  --on-accent: #ffffff;\n  --warn: #b3261e;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg: #10141a; --surface: #171d25; --surface-2: #212934; --ink: #e7ebf1; --muted: #98a3b4; --line: #2b3441;\n    --accent: #86a1ff; --on-accent: #0a1020; --warn: #ff8f86;\n    color-scheme: dark;\n  }\n}\n:root[data-theme=\"dark\"] {\n  --bg: #10141a; --surface: #171d25; --surface-2: #212934; --ink: #e7ebf1; --muted: #98a3b4; --line: #2b3441;\n  --accent: #86a1ff; --on-accent: #0a1020; --warn: #ff8f86;\n  color-scheme: dark;\n}\n\n* { box-sizing: border-box; }\nbody {\n  background: var(--bg);\n  color: var(--ink);\n  font: 400 15px/1.5 var(--font-body);\n  padding-block: 28px 56px;\n  padding-left: max(16px, env(safe-area-inset-left, 0px));\n  padding-right: max(16px, env(safe-area-inset-right, 0px));\n}\n.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 22px; }\nh1, h2 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; }\nh1 { font-size: clamp(2.4rem, 6vw, 3.6rem); line-height: 0.95; letter-spacing: 0.01em; text-transform: uppercase; }\nh2 { font-size: 1.25rem; letter-spacing: 0.06em; text-transform: uppercase; }\n.kicker { font: 500 12px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }\n.lede { max-width: 66ch; color: var(--muted); margin: 12px 0 0; }\n\n.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; display: grid; gap: 10px; padding: 14px; min-width: 0; }\n.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }\n.panel-head h2 { display: flex; align-items: center; gap: 10px; }\n.tag { font: 500 11px/1 var(--font-mono); letter-spacing: 0.06em; padding: 4px 6px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); }\ntextarea { width: 100%; min-height: 200px; resize: vertical; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 10px; font: 400 12.5px/1.5 var(--font-mono); white-space: pre; overflow: auto; }\ntextarea:focus-visible, input:focus-visible, select:focus-visible, button:focus-visible, .filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }\n.info { margin: 0; font: 400 12.5px/1.4 var(--font-mono); color: var(--muted); min-height: 1.4em; }\n.info.warn { color: var(--warn); }\n\nbutton, .filebtn { font: 600 13px/1 var(--font-body); letter-spacing: 0.03em; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }\nbutton:hover, .filebtn:hover { background: var(--surface-2); }\n.filebtn { position: relative; }\n.filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }\nbutton.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }\nbutton.primary:hover { filter: brightness(1.08); background: var(--accent); }\n.actions { display: flex; gap: 8px; flex-wrap: wrap; }\n\n.options { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }\n.field { display: grid; gap: 5px; min-width: 0; }\n.field label, .field .lab { font: 500 11px/1 var(--font-mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }\nselect, input[type=\"text\"], input[type=\"number\"] { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; font: 400 13px/1.2 var(--font-mono); min-width: 0; }\ninput[type=\"number\"] { width: 84px; }\ninput[type=\"text\"] { width: 130px; }\ninput:disabled { opacity: 0.5; }\n.check { display: inline-flex; align-items: center; gap: 7px; font: 400 13px/1.2 var(--font-body); color: var(--ink); text-transform: none; letter-spacing: 0; cursor: pointer; }\n.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }\n.colors { display: flex; flex-wrap: wrap; gap: 6px 14px; min-height: 34px; align-items: center; }\n.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line); }\n\n.tablewrap { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; }\ntable { border-collapse: collapse; width: 100%; min-width: 560px; }\nth { text-align: left; font: 500 11px/1 var(--font-mono); letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); padding: 11px 12px; border-bottom: 2px solid var(--ink); white-space: nowrap; }\ntd { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }\ntr:last-child td { border-bottom: 0; }\ntd.tc { font: 400 13px/1.4 var(--font-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }\n.dim { color: var(--muted); }\n.empty { padding: 28px 16px; color: var(--muted); text-align: center; }\n\n.out { display: grid; gap: 10px; }\n.out p { margin: 0; color: var(--muted); max-width: 72ch; }\n#outText { min-height: 220px; }\ndetails summary { cursor: pointer; font: 500 12px/1 var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 6px 0; }\ndetails[open] summary { margin-bottom: 8px; }\n.foot { color: var(--muted); font-size: 13px; max-width: 78ch; }\n@media (prefers-reduced-motion: no-preference) { button { transition: background 0.12s; } }\n<\/style>\n\n<main class=\"wrap\">\n  <header>\n    <p class=\"kicker\">Assistant monteur · Avid Media Composer<\/p>\n    <h1>EDL to SubCap<\/h1>\n    <p class=\"lede\">Colle un EDL Avid exporté avec ses markers. Chaque marker devient un sous-titre SubCap, avec son timecode d'entrée, un timecode de sortie calculé et son commentaire comme texte.<\/p>\n  <\/header>\n\n  <section class=\"panel\" aria-label=\"EDL source\">\n    <div class=\"panel-head\">\n      <h2><span class=\"tag\">EDL<\/span> Fichier source<\/h2>\n      <div class=\"actions\">\n        <label class=\"filebtn\">Charger un .edl<input type=\"file\" id=\"edlFile\" accept=\".edl,.txt,text/plain\"><\/label>\n        <button type=\"button\" id=\"clearBtn\">Vider<\/button>\n      <\/div>\n    <\/div>\n    <textarea id=\"edlText\" spellcheck=\"false\" aria-label=\"Contenu de l'EDL\" placeholder=\"Colle ici l'EDL (les lignes * LOC: portent les markers)\"><\/textarea>\n    <p class=\"info\" id=\"edlInfo\"><\/p>\n  <\/section>\n\n  <section class=\"options\" aria-label=\"Réglages\">\n    <div class=\"field\">\n      <label for=\"fps\">Cadence<\/label>\n      <select id=\"fps\">\n        <option value=\"23.976\">23.976<\/option>\n        <option value=\"24\" selected>24<\/option>\n        <option value=\"25\">25<\/option>\n        <option value=\"29.97\">29.97<\/option>\n        <option value=\"30\">30<\/option>\n      <\/select>\n    <\/div>\n    <div class=\"field\">\n      <label for=\"mode\">Fin du sous-titre<\/label>\n      <select id=\"mode\">\n        <option value=\"fixed\">Durée fixe<\/option>\n        <option value=\"next\">Jusqu'au marker suivant<\/option>\n      <\/select>\n    <\/div>\n    <div class=\"field\">\n      <label for=\"seconds\" id=\"secLabel\">Durée (s)<\/label>\n      <input type=\"number\" id=\"seconds\" value=\"3\" min=\"0.1\" step=\"0.5\">\n    <\/div>\n    <div class=\"field\" id=\"capField\" hidden>\n      <label for=\"cap\">Durée max (s)<\/label>\n      <input type=\"number\" id=\"cap\" value=\"6\" min=\"0.1\" step=\"0.5\">\n    <\/div>\n    <div class=\"field\" id=\"trimField\">\n      <span class=\"lab\">Chevauchement<\/span>\n      <label class=\"check\"><input type=\"checkbox\" id=\"trim\" checked> Couper au marker suivant<\/label>\n    <\/div>\n    <div class=\"field\">\n      <label for=\"offset\">Soustraire (HH:MM:SS:FF)<\/label>\n      <input type=\"text\" id=\"offset\" value=\"00:00:00:00\" spellcheck=\"false\" autocomplete=\"off\">\n    <\/div>\n    <div class=\"field\">\n      <label for=\"wrap\">Largeur de ligne<\/label>\n      <input type=\"number\" id=\"wrap\" value=\"0\" min=\"0\" step=\"1\">\n    <\/div>\n    <div class=\"field\">\n      <span class=\"lab\">Couleurs de markers à inclure<\/span>\n      <div class=\"colors\" id=\"colors\"><\/div>\n    <\/div>\n  <\/section>\n\n  <section aria-label=\"Sous-titres\">\n    <div class=\"tablewrap\" id=\"results\"><\/div>\n  <\/section>\n\n  <section class=\"out\" aria-label=\"Fichier SubCap\">\n    <h2>Fichier SubCap<\/h2>\n    <p id=\"outMsg\">Télécharge le fichier .txt, puis importe-le dans Media Composer.<\/p>\n    <div class=\"actions\">\n      <button type=\"button\" id=\"dlBtn\" class=\"primary\">Télécharger le .txt<\/button>\n      <button type=\"button\" id=\"copyBtn\">Copier le SubCap<\/button>\n    <\/div>\n    <details id=\"preview\">\n      <summary>Voir le contenu du fichier<\/summary>\n      <textarea id=\"outText\" readonly spellcheck=\"false\" aria-label=\"Contenu du fichier SubCap\"><\/textarea>\n    <\/details>\n    <p>Dans Media Composer : ajoute l'effet SubCap (Effect Palette, Generator) sur une piste vidéo au-dessus de la timeline, ouvre l'Effect Editor, clique sur Import Caption Data et choisis le type Avid DS Caption File (*.txt).<\/p>\n  <\/section>\n\n  <p class=\"foot\">Les timecodes du SubCap doivent correspondre à ceux de la timeline : garde « Soustraire » à 00:00:00:00 si ta séquence démarre à l'heure de l'EDL. Les calculs se font sans correction drop frame. Les markers au même timecode sont regroupés en un seul sous-titre. Rien n'est envoyé : tout se passe dans ton navigateur.<\/p>\n<\/main>\n\n<\script>\n//#core-start\nconst EDL_LOC = /^\\s*\\*\\s*LOC:\\s*(\\d{2}[:;]\\d{2}[:;]\\d{2}[:;]\\d{2})\\s+([A-Za-z]+)\\s*(.*)$/;\n\nfunction parseEdlMarkers(text) {\n  const markers = [];\n  let events = 0;\n  for (const raw of String(text || '').split(/\\r\\n|\\n|\\r/)) {\n    const m = raw.match(EDL_LOC);\n    if (m) markers.push({ tc: m[1], color: m[2].toUpperCase(), text: m[3].replace(/\\s+/g, ' ').trim() });\n    else if (/^\\s*\\d{3,}\\s+\\S+/.test(raw)) events++;\n  }\n  return { markers, events };\n}\n\nfunction tcToFrames(tc, fps) {\n  const p = String(tc).split(/[:;]/).map(Number);\n  const nf = Math.round(fps) || 24;\n  return ((p[0] * 60 + p[1]) * 60 + p[2]) * nf + p[3];\n}\n\nfunction framesToTc(fr, fps, sep) {\n  const nf = Math.round(fps) || 24;\n  const p = n => String(n).padStart(2, '0');\n  const f = fr % nf;\n  let s = Math.floor(fr / nf);\n  const ss = s % 60;\n  s = Math.floor(s / 60);\n  const mm = s % 60;\n  const hh = Math.floor(s / 60);\n  return p(hh) + ':' + p(mm) + ':' + p(ss) + (sep || ':') + p(f);\n}\n\nfunction wrapText(text, width) {\n  if (!width || width < 1) return text;\n  return text.split('\\n').map(line => {\n    const words = line.split(' ');\n    const out = [];\n    let cur = '';\n    for (const w of words) {\n      if (!cur) cur = w;\n      else if ((cur + ' ' + w).length <= width) cur += ' ' + w;\n      else { out.push(cur); cur = w; }\n    }\n    if (cur) out.push(cur);\n    return out.join('\\n');\n  }).join('\\n');\n}\n\nfunction buildCaptions(markers, opts) {\n  const nf = Math.round(opts.fps) || 24;\n  const colors = opts.colors;\n  const sel = markers.filter(m => !colors || colors.has(m.color));\n  let dropped = 0, empty = 0;\n  const items = [];\n  sel.forEach(m => {\n    const fr = tcToFrames(m.tc, nf) - (opts.offsetFrames || 0);\n    if (fr < 0) { dropped++; return; }\n    if (!m.text) empty++;\n    items.push({ frames: fr, sep: m.tc.charAt(8), text: m.text, colors: [m.color] });\n  });\n  items.sort((a, b) => a.frames - b.frames);\n  const groups = [];\n  items.forEach(it => {\n    const last = groups[groups.length - 1];\n    if (last && last.frames === it.frames) {\n      if (it.text) last.text = last.text ? last.text + '\\n' + it.text : it.text;\n      if (!last.colors.includes(it.colors[0])) last.colors.push(it.colors[0]);\n    } else groups.push({ frames: it.frames, sep: it.sep, text: it.text, colors: it.colors.slice() });\n  });\n  const fixed = Math.max(1, Math.round((opts.seconds || 3) * nf));\n  const cap = Math.max(1, Math.round((opts.capSeconds || 6) * nf));\n  const captions = groups.map((g, i) => {\n    const next = groups[i + 1];\n    let out;\n    if (opts.mode === 'next') out = next ? Math.min(next.frames, g.frames + cap) : g.frames + fixed;\n    else {\n      out = g.frames + fixed;\n      if (opts.trim && next && next.frames < out) out = next.frames;\n    }\n    if (out <= g.frames) out = g.frames + 1;\n    return {\n      inFrames: g.frames, outFrames: out,\n      tcIn: framesToTc(g.frames, nf, g.sep), tcOut: framesToTc(out, nf, g.sep),\n      text: wrapText(g.text, opts.wrap), colors: g.colors\n    };\n  });\n  return { captions, dropped, empty };\n}\n\nfunction buildSubcap(captions) {\n  const lines = ['@ This file written with the Avid Caption plugin, version 1', '', '<begin subtitles>'];\n  captions.forEach(c => {\n    lines.push(c.tcIn + ' ' + c.tcOut);\n    c.text.split('\\n').forEach(t => lines.push(t));\n    lines.push('');\n  });\n  lines.push('<end subtitles>');\n  return lines.join('\\n');\n}\nfunction subcapFileName(edlText) {\n  const m = String(edlText || '').match(/^\\s*TITLE:\\s*(.+)$/m);\n  const marks = new RegExp('[' + String.fromCharCode(0x300) + '-' + String.fromCharCode(0x36f) + ']', 'g');\n  let base = m ? m[1].trim().normalize('NFD').replace(marks, '').replace(/[^A-Za-z0-9._-]+/g, '_').replace(/^_+|_+$/g, '') : '';\n  if (!base) base = 'sequence';\n  return base + '_subcap.txt';\n}\n//#core-end\n\n/* ---------- UI ---------- */\nconst $ = id => document.getElementById(id);\nconst COLOR_HEX = { RED: '#e53935', GREEN: '#2e9e4f', BLUE: '#2f6fe0', CYAN: '#12b5c9', MAGENTA: '#c2379d', YELLOW: '#e8b923', BLACK: '#111111', WHITE: '#ffffff' };\nconst esc = s => String(s == null ? '' : s).replace(/[&<>\"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' }[c]));\nconst colorOn = {};\nlet seenColors = [];\n\nfunction dotHtml(c) { return '<span class=\"dot\" style=\"background:' + (COLOR_HEX[c] || 'transparent') + '\"><\/span>'; }\n\nfunction parseOffset(str, fps) {\n  const s = String(str || '').trim();\n  if (!s) return { frames: 0, ok: true };\n  if (!/^\\d{1,2}[:;]\\d{2}[:;]\\d{2}[:;]\\d{2}$/.test(s)) return { frames: 0, ok: false };\n  return { frames: tcToFrames(s, fps), ok: true };\n}\n\nfunction renderColors(colors) {\n  seenColors = colors;\n  colors.forEach(c => { if (!(c in colorOn)) colorOn[c] = true; });\n  $('colors').innerHTML = colors.length ? colors.map(c =>\n    '<label class=\"check\"><input type=\"checkbox\" data-c=\"' + esc(c) + '\"' + (colorOn[c] ? ' checked' : '') + '>' + dotHtml(c) + esc(c.toLowerCase()) + '<\/label>'\n  ).join('') : '<span class=\"dim\">Aucun marker détecté<\/span>';\n}\n\nfunction fmtDur(frames, fps) {\n  const nf = Math.round(fps) || 24;\n  const s = Math.floor(frames / nf), f = frames % nf;\n  return (s ? s + ' s ' : '') + f + ' f';\n}\n\nfunction run() {\n  const fps = parseFloat($('fps').value) || 24;\n  const mode = $('mode').value;\n  $('secLabel').textContent = mode === 'next' ? 'Durée du dernier (s)' : 'Durée (s)';\n  $('capField').hidden = mode !== 'next';\n  $('trimField').hidden = mode === 'next';\n\n  const text = $('edlText').value;\n  const parsed = parseEdlMarkers(text);\n  const found = [];\n  parsed.markers.forEach(m => { if (!found.includes(m.color)) found.push(m.color); });\n  if (found.join() !== seenColors.join()) renderColors(found);\n\n  const info = $('edlInfo');\n  if (!text.trim()) { info.textContent = ''; info.className = 'info'; }\n  else if (!parsed.markers.length) {\n    info.textContent = 'Aucun marker trouvé. L\\'EDL doit contenir des lignes du type « * LOC: 01:00:04:12 RED commentaire ».';\n    info.className = 'info warn';\n  } else {\n    info.textContent = parsed.markers.length + ' marker' + (parsed.markers.length > 1 ? 's' : '') + ' · ' + parsed.events + ' événement' + (parsed.events > 1 ? 's' : '');\n    info.className = 'info';\n  }\n\n  const off = parseOffset($('offset').value, fps);\n  const colors = new Set(found.filter(c => colorOn[c]));\n  const res = buildCaptions(parsed.markers, {\n    fps, colors, mode,\n    seconds: parseFloat($('seconds').value) || 3,\n    capSeconds: parseFloat($('cap').value) || 6,\n    trim: $('trim').checked,\n    offsetFrames: off.ok ? off.frames : 0,\n    wrap: parseInt($('wrap').value, 10) || 0\n  });\n  const notes = [];\n  if (!off.ok) notes.push('Décalage invalide (format HH:MM:SS:FF), ignoré.');\n  if (res.dropped) notes.push(res.dropped + ' marker' + (res.dropped > 1 ? 's' : '') + ' avant le décalage, ignoré' + (res.dropped > 1 ? 's' : '') + '.');\n  if (res.empty) notes.push(res.empty + ' marker' + (res.empty > 1 ? 's' : '') + ' sans commentaire.');\n  if (notes.length) { info.textContent += (info.textContent ? ' · ' : '') + notes.join(' '); info.className = 'info warn'; }\n\n  const box = $('results');\n  if (!res.captions.length) {\n    box.innerHTML = '<div class=\"empty\">' + (parsed.markers.length ? 'Aucun sous-titre avec ces réglages. Vérifie les couleurs cochées.' : 'Colle ou charge un EDL pour voir les sous-titres ici.') + '<\/div>';\n    $('outText').value = '';\n    return;\n  }\n  box.innerHTML = '<table><thead><tr><th>Entrée<\/th><th>Sortie<\/th><th>Durée<\/th><th>Couleur<\/th><th>Texte<\/th><\/tr><\/thead><tbody>' +\n    res.captions.map(c =>\n      '<tr><td class=\"tc\">' + esc(c.tcIn) + '<\/td><td class=\"tc\">' + esc(c.tcOut) + '<\/td><td class=\"tc\">' + esc(fmtDur(c.outFrames - c.inFrames, fps)) + '<\/td>' +\n      '<td>' + c.colors.map(x => dotHtml(x) + ' ' + esc(x.toLowerCase())).join('<br>') + '<\/td>' +\n      '<td>' + (esc(c.text).replace(/\\n/g, '<br>') || '<span class=\"dim\">-<\/span>') + '<\/td><\/tr>'\n    ).join('') + '<\/tbody><\/table>';\n  $('outText').value = buildSubcap(res.captions);\n}\n\nlet timer = null;\nconst later = () => { clearTimeout(timer); timer = setTimeout(run, 150); };\n\nfunction readFile(file) {\n  const rd = new FileReader();\n  rd.onload = () => {\n    const txt = String(rd.result || '');\n    if (txt.indexOf(String.fromCharCode(65533)) >= 0) {\n      const rd2 = new FileReader();\n      rd2.onload = () => { $('edlText').value = String(rd2.result || ''); run(); };\n      rd2.readAsText(file, 'windows-1252');\n      return;\n    }\n    $('edlText').value = txt; run();\n  };\n  rd.readAsText(file, 'utf-8');\n}\n$('edlFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) readFile(f); e.target.value = ''; });\n$('edlText').addEventListener('dragover', e => e.preventDefault());\n$('edlText').addEventListener('drop', e => {\n  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];\n  if (f) { e.preventDefault(); readFile(f); }\n});\n$('edlText').addEventListener('input', later);\n['fps', 'mode', 'seconds', 'cap', 'trim', 'offset', 'wrap'].forEach(id => { $(id).addEventListener('input', later); $(id).addEventListener('change', later); });\n$('colors').addEventListener('change', e => {\n  const c = e.target && e.target.dataset && e.target.dataset.c;\n  if (c) { colorOn[c] = e.target.checked; run(); }\n});\n$('clearBtn').addEventListener('click', () => { $('edlText').value = ''; run(); });\n// Inside the Claude viewer the file goes through the downloads capability (the viewer confirms the save).\n// Opened on its own as a .html file, the browser downloads it directly.\nasync function getDownloads() {\n  try { if (window.claude && window.claude.use) return await window.claude.use('downloads'); } catch (e) { /* fall through */ }\n  return null;\n}\n\nfunction downloadText(name, text) {\n  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  a.href = url; a.download = name;\n  document.body.appendChild(a); a.click(); a.remove();\n  setTimeout(() => URL.revokeObjectURL(url), 1500);\n}\n$('dlBtn').addEventListener('click', async () => {\n  const msg = $('outMsg');\n  const text = $('outText').value;\n  if (!text) { msg.textContent = 'Rien à télécharger : aucun sous-titre généré.'; return; }\n  const name = subcapFileName($('edlText').value);\n  const dl = await getDownloads();\n  if (dl) {\n    try {\n      await dl.save({ filename: name, data: text });\n      msg.textContent = name + ' enregistré.';\n    } catch (e) {\n      const code = e && e.code;\n      if (code === 'declined') msg.textContent = 'Téléchargement annulé.';\n      else if (code === 'rate_limited') msg.textContent = 'Une demande est déjà en cours. Réessaie dans un instant.';\n      else {\n        $('preview').open = true;\n        msg.textContent = 'Le téléchargement n\\'est pas disponible dans cette vue : copie le texte ci-dessous.';\n      }\n    }\n    return;\n  }\n  downloadText(name, text);\n  msg.textContent = 'Téléchargement lancé : ' + name + ' (dossier Téléchargements de ton navigateur).';\n});\n\n$('copyBtn').addEventListener('click', async () => {\n  const ta = $('outText');\n  const text = ta.value;\n  if (!text) { $('outMsg').textContent = 'Rien à copier : aucun sous-titre généré.'; return; }\n  $('preview').open = true;\n  ta.focus(); ta.select();\n  let ok = false;\n  try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }\n  $('outMsg').textContent = ok ? 'SubCap copié. Colle-le dans un fichier .txt (éditeur de texte brut).' : 'Le texte est sélectionné : copie-le avec Ctrl ou Cmd + C, puis colle-le dans un fichier .txt.';\n});\n\nrun();\n<\/script>\n\n<\/body><\/html>" }
];

const tabs = document.getElementById('tabs');
const panes = document.getElementById('panes');
const frames = {};
const buttons = {};

TOOLS.forEach(t => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'tab'; b.id = 'tab-' + t.id;
  b.setAttribute('role', 'tab'); b.setAttribute('aria-controls', 'pane-' + t.id);
  b.textContent = t.label;
  b.addEventListener('click', () => select(t.id));
  tabs.appendChild(b);
  buttons[t.id] = b;

  const f = document.createElement('iframe');
  f.id = 'pane-' + t.id; f.title = t.label;
  f.setAttribute('role', 'tabpanel'); f.setAttribute('aria-labelledby', 'tab-' + t.id);
  f.srcdoc = t.html;
  panes.appendChild(f);
  frames[t.id] = f;
});

function select(id, fromHash) {
  if (!frames[id]) id = TOOLS[0].id;
  TOOLS.forEach(t => {
    const on = t.id === id;
    frames[t.id].hidden = !on;
    buttons[t.id].setAttribute('aria-selected', on ? 'true' : 'false');
    buttons[t.id].tabIndex = on ? 0 : -1;
  });
  if (!fromHash) { try { history.replaceState(null, '', '#' + id); } catch (e) { location.hash = id; } }
}

tabs.addEventListener('keydown', e => {
  if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
  const i = TOOLS.findIndex(t => buttons[t.id].getAttribute('aria-selected') === 'true');
  const n = (i + (e.key === 'ArrowRight' ? 1 : TOOLS.length - 1)) % TOOLS.length;
  select(TOOLS[n].id); buttons[TOOLS[n].id].focus();
});
window.addEventListener('hashchange', () => select(location.hash.slice(1), true));

// Le premier onglet (Marker Diff) s'ouvre par défaut ; #subcap ouvre directement le second.
select(location.hash.slice(1) || TOOLS[0].id, true);
</script>
