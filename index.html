.grp { position: relative; display: inline-flex; }

.hcard:hover::before, .hcard:focus-visible::before { opacity: 1; }

.hcard .lay { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .2s; mix-blend-mode: screen; -webkit-mask-image: radial-gradient(120px circle at var(--mx) var(--my), #000 0, transparent 100%); mask-image: radial-gradient(120px circle at var(--mx) var(--my), #000 0, transparent 100%); }
.hcard .lay * { color: inherit !important; background: none !important; border-color: transparent !important; box-shadow: none !important; }
.hcard .lay.lr { color: #ff2d5f; transform: translateX(-1.6px); }
.hcard .lay.lc { color: #00d7ff; transform: translateX(1.6px); }
:root[data-theme="light"] .hcard .lay { mix-blend-mode: multiply; }
.hcard:hover .lay { opacity: .85; }
.hcard .ic { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
.hcard .nm { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.hcard .ds { font-size: 13.5px; line-height: 1.45; color: var(--ink-2); }
.hcard .go { margin-top: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--c); }
.hcard .go svg { transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.hcard:hover .go svg { transform: translateX(5px); }
.hcard[hidden] { display: none; }
@media (prefers-reduced-motion: no-preference) { #home .hd, .hcard { animation: hrise .7s cubic-bezier(.2,.8,.2,1) backwards; } .hcard { animation-delay: calc(var(--i, 0) * 60ms + .1s); } @keyframes hrise { from { opacity: 0; transform: translateY(24px); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } } }
@media (prefers-reduced-motion: reduce) { .hcard:hover { transform: none; } }
@media (max-width: 900px) { html.is-home .cornerrow { position: static; height: auto; } #home { padding-top: 24px; } }
.tab.homebtn { color: var(--ink-2); }

.corner .sep { margin: 0 2px; }

#home .eyebrow { font: 500 12px/1 "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; }
#home h1 { font-family: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif; text-transform: uppercase; font-size: clamp(2.6rem, 7vw, 4.6rem); line-height: .95; letter-spacing: .01em; }

:root[data-theme="light"] .hsec[data-cat="sorties"] { --c: #c97a1a; }

/* titre : aberration chromatique (repos léger, éclat à l'arrivée, amplifiée par le curseur) */
#home h1.ca { position: relative; display: block; width: fit-content; max-width: 100%; --dx: 1.5px; --dy: 0px; cursor: default; }
#home h1.ca > span { position: relative; z-index: 1; }
#home h1.ca::before, #home h1.ca::after { content: attr(data-t); position: absolute; left: 0; top: 0; width: 100%; z-index: 0; pointer-events: none; transition: transform .25s cubic-bezier(.2,.8,.2,1); }
#home h1.ca::before { color: #ff2d5f; transform: translate(calc(var(--dx) * -1), calc(var(--dy) * -1)); }
#home h1.ca::after { color: #00d7ff; transform: translate(var(--dx), var(--dy)); }
:root[data-theme="dark"] #home h1.ca::before, :root[data-theme="dark"] #home h1.ca::after { mix-blend-mode: screen; opacity: .85; }
:root[data-theme="light"] #home h1.ca::before, :root[data-theme="light"] #home h1.ca::after { mix-blend-mode: multiply; opacity: .8; }
@media (prefers-reduced-motion: no-preference) {
  #home h1.ca::before { animation: caA 1.1s steps(1) .2s 1 both; }
  #home h1.ca::after { animation: caB 1.1s steps(1) .2s 1 both; }
  @keyframes caA { 0% { transform: translate(-14px, 0); clip-path: inset(10% 0 62% 0); } 14% { transform: translate(10px, 2px); clip-path: inset(55% 0 12% 0); } 28% { transform: translate(-8px, -2px); clip-path: inset(30% 0 40% 0); } 42% { transform: translate(6px, 0); clip-path: inset(0 0 70% 0); } 56% { transform: translate(-4px, 1px); clip-path: inset(70% 0 0 0); } 70% { transform: translate(-3px, 0); clip-path: none; } 100% { transform: translate(calc(var(--dx) * -1), calc(var(--dy) * -1)); clip-path: none; } }
  @keyframes caB { 0% { transform: translate(14px, 0); clip-path: inset(60% 0 10% 0); } 14% { transform: translate(-10px, -2px); clip-path: inset(12% 0 55% 0); } 28% { transform: translate(8px, 2px); clip-path: inset(40% 0 30% 0); } 42% { transform: translate(-6px, 0); clip-path: inset(70% 0 0 0); } 56% { transform: translate(4px, -1px); clip-path: inset(0 0 70% 0); } 70% { transform: translate(3px, 0); clip-path: none; } 100% { transform: translate(var(--dx), var(--dy)); clip-path: none; } }
}

/* arrivée après déverrouillage : l'accueil s'ouvre depuis le centre, les cartes montent, une pastille confirme les accès */
@media (prefers-reduced-motion: no-preference) {
  html.arrive #home { animation: arrive 1.15s cubic-bezier(.7,0,.2,1) both; }
  @keyframes arrive { from { clip-path: circle(0% at 50% 38%); filter: blur(10px) drop-shadow(-10px 0 0 rgba(255,45,95,.5)) drop-shadow(10px 0 0 rgba(0,215,255,.5)); } 60% { filter: blur(0) drop-shadow(-4px 0 0 rgba(255,45,95,.45)) drop-shadow(4px 0 0 rgba(0,215,255,.45)); } to { clip-path: circle(140% at 50% 38%); filter: none; } }
  html.arrive .hcard { animation-delay: calc(var(--i, 0) * 70ms + .55s); }
  .hwelcome { animation: welcomeIn .6s cubic-bezier(.2,.8,.2,1) .7s backwards, welcomeOut .6s ease 3.6s forwards; }

}

/* tactile : pas d'effets de survol, retour au toucher à la place ; cibles plus grandes */
@media (hover: none) {
  .hcard .lay { display: none; }

}

}

  .htab { flex: none; }
}

  var V = JSON.parse(document.getElementById('vault').textContent);
  var dlg = document.getElementById('vltDlg'), form = document.getElementById('vltForm'), inp = document.getElementById('vltPw');
  var msg = document.getElementById('vltMsg'), go = document.getElementById('vltGo'), no = document.getElementById('vltNo');
  var gate = document.documentElement.hasAttribute('data-gate');
  var te = new TextEncoder();
  function u8(b) { var s = atob(b), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
  function hx(a) { return Array.prototype.map.call(new Uint8Array(a), function (x) { return (x < 16 ? '0' : '') + x.toString(16); }).join(''); }
  function sha(tag, dk) { var d = new Uint8Array(dk), t = te.encode(tag), m = new Uint8Array(t.length + d.length); m.set(t); m.set(d, t.length); return crypto.subtle.digest('SHA-256', m); }
  async function attempt(pw) {
    var base = await crypto.subtle.importKey('raw', te.encode(pw), 'PBKDF2', false, ['deriveBits']);
    var dk = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: u8(V.s), iterations: V.it, hash: 'SHA-256' }, base, 256);
    var tag = hx(await sha('t', dk)).slice(0, 16);
    if (!Object.prototype.hasOwnProperty.call(V.slots, tag)) return null;
    var slot = V.slots[tag], wk = await crypto.subtle.importKey('raw', await sha('k', dk), 'AES-GCM', false, ['decrypt']), p;
    try { p = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(slot.i) }, wk, u8(slot.c)))); } catch (e) { return null; }
    var lv = V.lv[p.l], K = await crypto.subtle.importKey('raw', u8(p.k), 'AES-GCM', false, ['decrypt']);
    var gz = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(lv.i) }, K, u8(lv.c));
    return new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  function show() {
    var lg = document.getElementById('legal'); if (lg && lg.open) lg.close();
    if (!dlg.open) dlg.showModal();
    msg.textContent = ''; inp.value = ''; inp.focus();
  }
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var pw = inp.value.trim(); if (!pw) return;
    if (!(window.crypto && crypto.subtle && window.DecompressionStream)) { msg.textContent = 'Navigateur non compatible.'; return; }

    }
    go.disabled = false; msg.textContent = 'Mot de passe incorrect.';
    dlg.classList.remove('shake'); void dlg.offsetWidth; dlg.classList.add('shake'); inp.select();
  });

    no.hidden = true; show();
  } else {
    no.addEventListener('click', function () { dlg.close(); });
    if (V.k && V.n) {
      var salt = u8(V.s), buf = '', idle = null;
      var watch = function (d) {
        if (!d || d.__vk) return; d.__vk = 1;
        d.addEventListener('beforeinput', function (e) {
          var c = e.data; if (!c || !/^[0-9]$/.test(c)) return;
          if (e.target && e.target.closest && e.target.closest('[data-nocode]')) return;
          buf = (buf + c).slice(-V.n); clearTimeout(idle); idle = setTimeout(function () { buf = ''; }, 5000);
          if (buf.length < V.n) return;
          var m = new Uint8Array(salt.length + 5 + buf.length); m.set(salt); m.set(te.encode('code:' + buf), salt.length);
          crypto.subtle.digest('SHA-256', m).then(function (h) { if (hx(h).slice(0, 16) === V.k) { buf = ''; show(); } });
        });
      };
      var scan = function () {
        var fr = document.querySelectorAll('#panel-codec-size iframe');
        for (var i = 0; i < fr.length; i++) { try { watch(fr[i].contentDocument); } catch (x) {} }
      };
      document.addEventListener('load', function (e) { if (e.target && e.target.tagName === 'IFRAME') { try { watch(e.target.contentDocument); } catch (x) {} } }, true);
      scan(); setInterval(scan, 1500);
    }
  }
