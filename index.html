const DNX_COLS = [23.976, 25, 29.97, 50, 59.94];
const DNX = {
  HD:  { &#x27;444&#x27;: [41.68, 43.46, 52.10, 86.91, 104.19], HQX: [20.79, 21.68, 25.99, 43.36, 51.98], HQ: [20.79, 21.68, 25.99, 43.36, 51.98], SQ: [13.77, 14.36, 17.21, 28.71, 34.42], LB: [4.31, 4.49, 5.39, 8.98, 10.77] },
  &#x27;2K&#x27;:{ &#x27;444&#x27;: [44.39, 46.29, 55.49, 92.58, 110.98], HQX: [22.20, 23.14, 27.75, 46.29, 55.49], HQ: [22.20, 23.14, 27.75, 46.29, 55.49], SQ: [14.70, 15.33, 18.38, 30.66, 36.76], LB: [4.59, 4.79, 5.74, 9.57, 11.47] },
  UHD: { &#x27;444&#x27;: [166.61, 173.73, 208.27, 347.46, 416.54], HQX: [83.26, 86.82, 104.08, 173.63, 208.15], HQ: [83.26, 86.82, 104.08, 173.63, 208.15], SQ: [55.07, 57.42, 68.84, 114.84, 137.67], LB: [17.14, 17.87, 21.42, 35.74, 42.85] },
  &#x27;4K&#x27;:{ &#x27;444&#x27;: [177.67, 185.25, 222.08, 370.51, 444.16], HQX: [88.88, 92.68, 111.10, 185.35, 222.20], HQ: [88.88, 92.68, 111.10, 185.35, 222.20], SQ: [58.72, 61.23, 73.40, 122.46, 146.81], LB: [18.26, 19.04, 22.83, 38.09, 45.66] }
};
const DNX_LIST = [
  { id: &#x27;LB&#x27;, label: &#x27;DNx LB&#x27;, note: &#x27;Low Bandwidth, 8 bits 4:2:2&#x27; },
  { id: &#x27;SQ&#x27;, label: &#x27;DNx SQ&#x27;, note: &#x27;Standard Quality, 8 bits 4:2:2&#x27; },
  { id: &#x27;HQ&#x27;, label: &#x27;DNx HQ&#x27;, note: &#x27;High Quality, 8 bits 4:2:2&#x27; },
  { id: &#x27;HQX&#x27;, label: &#x27;DNx HQX&#x27;, note: &#x27;High Quality, 10 bits 4:2:2&#x27; },
  { id: &#x27;444&#x27;, label: &#x27;DNx 444&#x27;, note: &#x27;10 bits 4:4:4&#x27; }
];

// ProRes : débits cibles Apple en Mbit/s, lignes 24 / 25 / 30 / 50 / 60 images par seconde.
const PR_COLS = [24, 25, 30, 50, 60];
const PR = {
  HD:  { Proxy: [36, 38, 45, 76, 91], LT: [82, 85, 102, 170, 204], &#x27;422&#x27;: [117, 122, 147, 245, 293], HQ: [176, 184, 220, 367, 440], &#x27;4444&#x27;: [264, 275, 330, 551, 660], XQ: [396, 413, 495, 826, 990] },
  UHD: { Proxy: [145, 151, 182, 303, 363], LT: [328, 342, 410, 684, 821], &#x27;422&#x27;: [471, 492, 589, 983, 1178], HQ: [707, 737, 884, 1475, 1768], &#x27;4444&#x27;: [1061, 1106, 1326, 2212, 2652], XQ: [1591, 1659, 1989, 3318, 3977] },
  &#x27;4K&#x27;:{ Proxy: [155, 162, 194, 323, 388], LT: [350, 365, 437, 730, 875], &#x27;422&#x27;: [503, 524, 629, 1049, 1257], HQ: [754, 786, 943, 1573, 1886], &#x27;4444&#x27;: [1131, 1180, 1414, 2359, 2828], XQ: [1697, 1769, 2121, 3539, 4242] }
};
const PR_LIST = [
  { id: &#x27;Proxy&#x27;, label: &#x27;ProRes 422 Proxy&#x27;, note: &#x27;10 bits 4:2:2&#x27; },
  { id: &#x27;LT&#x27;, label: &#x27;ProRes 422 LT&#x27;, note: &#x27;10 bits 4:2:2&#x27; },
  { id: &#x27;422&#x27;, label: &#x27;ProRes 422&#x27;, note: &#x27;10 bits 4:2:2&#x27; },
  { id: &#x27;HQ&#x27;, label: &#x27;ProRes 422 HQ&#x27;, note: &#x27;10 bits 4:2:2&#x27; },
  { id: &#x27;4444&#x27;, label: &#x27;ProRes 4444&#x27;, note: &#x27;12 bits 4:4:4, sans alpha&#x27; },
  { id: &#x27;XQ&#x27;, label: &#x27;ProRes 4444 XQ&#x27;, note: &#x27;12 bits 4:4:4, sans alpha&#x27; }
];

// Anciens noms DNxHD (le nombre était le débit en Mbit/s), pour 1080 : colonnes 23.976-24 / 25 / 29.97-30 / 50 / 59.94-60.
const DNX_LEGACY = {
  LB: [&#x27;36&#x27;, &#x27;36&#x27;, &#x27;45&#x27;, &#x27;75&#x27;, &#x27;90&#x27;],
  SQ: [&#x27;115&#x27;, &#x27;120&#x27;, &#x27;145&#x27;, &#x27;240&#x27;, &#x27;290&#x27;],
  HQ: [&#x27;175&#x27;, &#x27;185&#x27;, &#x27;220&#x27;, &#x27;365&#x27;, &#x27;440&#x27;],
  HQX: [&#x27;175x&#x27;, &#x27;185x&#x27;, &#x27;220x&#x27;, &#x27;365x&#x27;, &#x27;440x&#x27;],
  &#x27;444&#x27;: [&#x27;350x&#x27;, &#x27;365x&#x27;, &#x27;440x&#x27;, null, null]
};
function legacyName(size, id, fps) {
  if (size === &#x27;HD&#x27;) {
    const n = DNX_LEGACY[id][nearestCol(DNX_COLS, fps)];
    if (n) return &#x27;ex-DNxHD &#x27; + n;
  }
  return &#x27;ex-DNxHR &#x27; + id;
}

// Colonne de référence la plus proche de la cadence choisie.
function nearestCol(cols, fps) {
  let best = 0;
  cols.forEach((c, i) =&gt; { if (Math.abs(c - fps) &lt; Math.abs(cols[best] - fps)) best = i; });
  return best;
}

// Débit en octets par seconde.
function dnxBytesPerSec(size, id, fps) {
  const i = nearestCol(DNX_COLS, fps);
  return DNX[size][id][i] * 1e6 * fps / DNX_COLS[i];
}
function proresBytesPerSec(size, id, fps) {
  const i = nearestCol(PR_COLS, fps);
  const mbps = size === &#x27;2K&#x27; ? PR[&#x27;4K&#x27;][id][i] / 4 : PR[size][id][i];
  return mbps * 1e6 / 8 * fps / PR_COLS[i];
}

function durationSeconds(h, m, s, f, fps) {
  return Math.max(0, h) * 3600 + Math.max(0, m) * 60 + Math.max(0, s) + Math.max(0, f) / fps;
}

function buildRows(size, fps, seconds) {
  const rows = [];
  DNX_LIST.forEach(c =&gt; {
    const bps = dnxBytesPerSec(size, c.id, fps);
    rows.push({ fam: &#x27;dnx&#x27;, label: c.label, alias: legacyName(size, c.id, fps), note: c.note, bps, total: bps * seconds });
  });
  PR_LIST.forEach(c =&gt; {
    const bps = proresBytesPerSec(size, c.id, fps);
    rows.push({ fam: &#x27;prores&#x27;, label: c.label, note: c.note, bps, total: bps * seconds });
  });
  return rows;
}

function fmtBytes(bytes, mode) {
  if (mode === &#x27;mo&#x27;) {
    const mo = bytes / 1e6;
    const dm = mo &gt;= 100 ? 0 : 1;
    return mo.toLocaleString(&#x27;fr-FR&#x27;, { minimumFractionDigits: dm, maximumFractionDigits: dm }) + &#x27; Mo&#x27;;
  }
  const binary = mode === &#x27;bin&#x27;;
  const base = binary ? 1024 : 1000;
  const names = binary ? [&#x27;o&#x27;, &#x27;Kio&#x27;, &#x27;Mio&#x27;, &#x27;Gio&#x27;, &#x27;Tio&#x27;] : [&#x27;o&#x27;, &#x27;Ko&#x27;, &#x27;Mo&#x27;, &#x27;Go&#x27;, &#x27;To&#x27;];
  let v = bytes, i = 0;
  while (v &gt;= base &amp;&amp; i &lt; 4) { v /= base; i++; }
  if (i &lt; 2) { i = 2; v = bytes / Math.pow(base, 2); }
  const d = v &gt;= 100 ? 0 : v &gt;= 10 ? 1 : 2;
  return v.toLocaleString(&#x27;fr-FR&#x27;, { minimumFractionDigits: d, maximumFractionDigits: d }) + &#x27; &#x27; + names[i];
}
//#core-end

/* ---------- UI ---------- */
const $ = id =&gt; document.getElementById(id);
const nf = (v, d) =&gt; v.toLocaleString(&#x27;fr-FR&#x27;, { minimumFractionDigits: d, maximumFractionDigits: d });

function run() {
  const fps = parseFloat($(&#x27;fps&#x27;).value) || 24;
  const size = $(&#x27;size&#x27;).value;
  const mode = $(&#x27;units&#x27;).value;
  const aud = $(&#x27;audio&#x27;).value;
  const ap = aud === &#x27;none&#x27; ? [0, 0] : aud.split(&#x27;-&#x27;).map(Number);
  const abits = ap[0], arate = ap[1];
  const audioBps = abits ? arate * 1000 * abits / 8 * 2 : 0; // 2 pistes mono
  const h = parseInt($(&#x27;dh&#x27;).value, 10) || 0, m = Math.min(59, parseInt($(&#x27;dm&#x27;).value, 10) || 0);
  const s = Math.min(59, parseInt($(&#x27;ds&#x27;).value, 10) || 0), f = Math.min(Math.max(0, Math.round(fps) - 1), parseInt($(&#x27;df&#x27;).value, 10) || 0);
  const seconds = durationSeconds(h, m, s, f, fps);
  const frames = Math.round(seconds * fps);

  const hh = Math.floor(seconds / 3600), mm = Math.floor(seconds % 3600 / 60), ss = Math.floor(seconds % 60);
  $(&#x27;readout&#x27;).innerHTML = &#x27;&lt;span&gt;Durée &lt;strong&gt;&#x27; + hh + &#x27; h &#x27; + String(mm).padStart(2, &#x27;0&#x27;) + &#x27; min &#x27; + String(ss).padStart(2, &#x27;0&#x27;) + &#x27; s&lt;/strong&gt;&lt;/span&gt;&#x27; +
    &#x27;&lt;span&gt;&lt;strong&gt;&#x27; + frames.toLocaleString(&#x27;fr-FR&#x27;) + &#x27;&lt;/strong&gt; images à &#x27; + $(&#x27;fps&#x27;).value + &#x27; i/s&lt;/span&gt;&#x27; +
    (audioBps ? &#x27;&lt;span&gt;Son PCM stéréo &lt;strong&gt;&#x27; + abits + &#x27; bits &#x27; + arate + &#x27; kHz&lt;/strong&gt; : &#x27; + fmtBytes(audioBps * seconds, mode) + &#x27; (&#x27; + fmtBytes(audioBps * 3600, mode) + &#x27; par heure)&lt;/span&gt;&#x27; : &#x27;&#x27;);

  if (!seconds) {
    $(&#x27;results&#x27;).innerHTML = &#x27;&lt;div style=&quot;padding:28px 16px;color:var(--muted);text-align:center&quot;&gt;Entre une durée supérieure à zéro pour voir les tailles.&lt;/div&gt;&#x27;;
    return;
  }
  const rows = buildRows(size, fps, seconds).filter(r =&gt; r.fam === tab);
  const max = Math.max.apply(null, rows.map(r =&gt; r.total));
  let html = &#x27;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Codec&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Débit&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Mo/s&lt;/th&gt;&lt;th class=&quot;num&quot;&gt;Par heure&lt;/th&gt;&lt;th&gt;Taille totale&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27;;
  rows.forEach(r =&gt; {
    html += &#x27;&lt;tr data-f=&quot;&#x27; + r.fam + &#x27;&quot;&gt;&lt;td class=&quot;name&quot;&gt;&#x27; + r.label + (r.alias ? &#x27;&lt;span class=&quot;alias&quot;&gt;&#x27; + r.alias + &#x27;&lt;/span&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;small&gt;&#x27; + r.note + &#x27;&lt;/small&gt;&lt;/td&gt;&#x27; +
      &#x27;&lt;td class=&quot;num&quot;&gt;&#x27; + nf(r.bps * 8 / 1e6, r.bps * 8 / 1e6 &gt;= 100 ? 0 : 1) + &#x27; Mbit/s&lt;/td&gt;&#x27; +
      &#x27;&lt;td class=&quot;num&quot;&gt;&#x27; + nf(r.bps / 1e6, r.bps / 1e6 &gt;= 100 ? 0 : 1) + &#x27; Mo/s&lt;/td&gt;&#x27; +
      &#x27;&lt;td class=&quot;num&quot;&gt;&#x27; + fmtBytes(r.bps * 3600, mode) + &#x27;&lt;/td&gt;&#x27; +
      &#x27;&lt;td class=&quot;total&quot;&gt;&lt;div class=&quot;size&quot;&gt;&#x27; + fmtBytes(r.total, mode) + &#x27;&lt;/div&gt;&#x27; + (audioBps ? &#x27;&lt;div class=&quot;withaudio&quot;&gt;avec son : &lt;b&gt;&#x27; + fmtBytes(r.total + audioBps * seconds, mode) + &#x27;&lt;/b&gt;&lt;/div&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;div class=&quot;bar&quot;&gt;&lt;i style=&quot;width:&#x27; + Math.max(1, r.total / max * 100).toFixed(1) + &#x27;%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;&#x27;;
  });
  html += &#x27;&lt;/tbody&gt;&lt;/table&gt;&#x27;;
  $(&#x27;results&#x27;).innerHTML = html;
}

[&#x27;fps&#x27;, &#x27;size&#x27;, &#x27;units&#x27;, &#x27;audio&#x27;].forEach(id =&gt; { $(id).addEventListener(&#x27;input&#x27;, run); $(id).addEventListener(&#x27;change&#x27;, run); });

// Saisie de la durée façon timecode : le curseur passe à la case suivante quand la valeur est complète.
const DUR_IDS = [&#x27;dh&#x27;, &#x27;dm&#x27;, &#x27;ds&#x27;, &#x27;df&#x27;];
function durMax(id) {
  if (id === &#x27;dh&#x27;) return 99;
  if (id === &#x27;df&#x27;) return Math.max(0, Math.round(parseFloat($(&#x27;fps&#x27;).value) || 24) - 1);
  return 59;
}
function padDur(el) {
  el.value = String(Math.min(durMax(el.id), parseInt(el.value, 10) || 0)).padStart(el.id === &#x27;dh&#x27; ? 1 : 2, &#x27;0&#x27;);
}
function focusDur(i) {
  const el = $(DUR_IDS[i]);
  if (el) { el.focus(); el.select(); }
}
DUR_IDS.forEach((id, i) =&gt; {
  const el = $(id);
  el.addEventListener(&#x27;focus&#x27;, () =&gt; el.select());
  el.addEventListener(&#x27;input&#x27;, () =&gt; {
    el.value = el.value.replace(/\D/g, &#x27;&#x27;).slice(0, 2);
    const len = el.value.length;
    const done = id === &#x27;dh&#x27; ? len &gt;= 1 : (len &gt;= 2 || (len === 1 &amp;&amp; parseInt(el.value, 10) * 10 &gt; durMax(id)));
    if (done &amp;&amp; i &lt; DUR_IDS.length - 1) focusDur(i + 1);
    run();
  });
  el.addEventListener(&#x27;blur&#x27;, () =&gt; { padDur(el); run(); });
  el.addEventListener(&#x27;keydown&#x27;, e =&gt; {
    const k = e.key;
    if ([&#x27;:&#x27;, &#x27;;&#x27;, &#x27;,&#x27;, &#x27;.&#x27;, &#x27; &#x27;, &#x27;Enter&#x27;].includes(k)) {
      e.preventDefault();
      if (i &lt; DUR_IDS.length - 1) focusDur(i + 1);
    } else if (k === &#x27;Backspace&#x27; &amp;&amp; el.value === &#x27;&#x27; &amp;&amp; i &gt; 0) {
      e.preventDefault();
      focusDur(i - 1);
    } else if (k === &#x27;ArrowRight&#x27; &amp;&amp; el.selectionStart === el.value.length &amp;&amp; el.selectionEnd === el.value.length &amp;&amp; i &lt; DUR_IDS.length - 1) {
      e.preventDefault();
      focusDur(i + 1);
    } else if (k === &#x27;ArrowLeft&#x27; &amp;&amp; el.selectionStart === 0 &amp;&amp; el.selectionEnd === 0 &amp;&amp; i &gt; 0) {
      e.preventDefault();
      focusDur(i - 1);
    } else if (k === &#x27;ArrowUp&#x27; || k === &#x27;ArrowDown&#x27;) {
      e.preventDefault();
      const max = durMax(id);
      let v = (parseInt(el.value, 10) || 0) + (k === &#x27;ArrowUp&#x27; ? 1 : -1);
      if (v &gt; max) v = 0;
      if (v &lt; 0) v = max;
      el.value = String(v).padStart(id === &#x27;dh&#x27; ? 1 : 2, &#x27;0&#x27;);
      el.select();
      run();
    }
  });
  el.addEventListener(&#x27;paste&#x27;, e =&gt; {
    const parts = ((e.clipboardData &amp;&amp; e.clipboardData.getData(&#x27;text&#x27;)) || &#x27;&#x27;).match(/\d+/g);
    if (!parts || parts.length &lt; 2) return;
    e.preventDefault();
    parts.slice(0, DUR_IDS.length - i).forEach((p, k) =&gt; { $(DUR_IDS[i + k]).value = p.slice(-2); });
    DUR_IDS.forEach(d =&gt; padDur($(d)));
    run();
  });
});
$(&#x27;fps&#x27;).addEventListener(&#x27;change&#x27;, () =&gt; padDur($(&#x27;df&#x27;)));

let tab = &#x27;dnx&#x27;;
function setTab(t) {
  tab = t;
  document.querySelectorAll(&#x27;.tab&#x27;).forEach(b =&gt; b.setAttribute(&#x27;aria-selected&#x27;, String(b.dataset.t === t)));
  run();
}
document.querySelectorAll(&#x27;.tab&#x27;).forEach(b =&gt; b.addEventListener(&#x27;click&#x27;, () =&gt; setTab(b.dataset.t)));
if (location.hash === &#x27;#prores&#x27;) setTab(&#x27;prores&#x27;); else run();
&lt;/script&gt;

<script>
(function(){
  var HASH={'t-mt':'traceur','t-md':'markerdiff','t-edl':'edl','t-cs':'codec'};
  var tabs=[].slice.call(document.querySelectorAll('.tab'));
  function fit(f){
    try{
      var d=f.contentDocument; if(!d||!d.documentElement) return;
      var h=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0);
      if(h>0) f.style.height=h+'px';
    }catch(e){}
  }
  function wire(f){
    function go(){
      fit(f);
      try{
        var d=f.contentDocument;
        if(window.ResizeObserver&&d&&d.body&&!f._ro){f._ro=new ResizeObserver(function(){fit(f)});f._ro.observe(d.body);}
      }catch(e){}
    }
    f.addEventListener('load',go);
    if(f.contentDocument&&f.contentDocument.readyState==='complete') go();
  }
  [].forEach.call(document.querySelectorAll('iframe'),wire);
  function show(id,push){
    tabs.forEach(function(t){
      var on=t.id===id;
      t.setAttribute('aria-selected',on);
      var p=document.getElementById(t.getAttribute('aria-controls'));
      p.classList.toggle('on',on);
      if(on){var f=p.querySelector('iframe'); fit(f); setTimeout(function(){fit(f)},60);}
    });
    if(push){try{history.replaceState(null,'','#'+HASH[id]);}catch(e){}}
    window.scrollTo(0,0);
  }
  tabs.forEach(function(t){t.addEventListener('click',function(){show(t.id,true)});});
  tabs.forEach(function(t,i){t.addEventListener('keydown',function(e){
    var n=e.key==='ArrowRight'?i+1:e.key==='ArrowLeft'?i-1:-1;
    if(n<0||n>=tabs.length) return; e.preventDefault(); tabs[n].focus(); show(tabs[n].id,true);
  });});
  window.addEventListener('resize',function(){[].forEach.call(document.querySelectorAll('.panel.on iframe'),fit)});
  for(var k in HASH){ if(location.hash==='#'+HASH[k]) show(k,false); }
})();
</script>
